services:
  reverse_proxy:
    labels:
      - traefik.http.routers.traefik.middlewares=security-headers,traefik-auth
      - traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_USER}:${TRAEFIK_HTPASSWD}

  frontend:
    labels:
      - traefik.http.routers.frontend.middlewares=security-headers,frontend-auth
      - traefik.http.middlewares.frontend-auth.basicauth.users=${TRAEFIK_USER}:${TRAEFIK_HTPASSWD}
