networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}_network

  # Networks of the agent gateway, fixed in 10.231.0.0/16 so that they never cover addresses of the
  # surrounding network. Slot and egress networks are created by the orchestrator itself.
  agent_intern:
    name: ${COMPOSE_PROJECT_NAME}_agent_intern
    ipam: { config: [{ subnet: 10.231.18.0/24 }] }
  agent_search:
    name: ${COMPOSE_PROJECT_NAME}_agent_search
    ipam: { config: [{ subnet: 10.231.22.0/24 }] }
  # The package caches and the agent gateway's package gate (issue #175). No sandbox is attached; the gateway
  # reaches the caches here, so container-to-container traffic must stay on (no enable_icc: false).
  agent_pkg:
    name: ${COMPOSE_PROJECT_NAME}_agent_pkg
    ipam: { config: [{ subnet: 10.231.21.0/24 }] }

  # The simulated edge device (profile "edge-sim") sits alone in this internal network. It reaches
  # Portainer, the edge tunnel and the registry through Traefik, but has neither internet nor a
  # direct route to the other platform services. 10.231.30.0/24 keeps it outside Docker's default
  # 172.x range, which once covered the address of the platform API inside the VM.
  edge_sim:
    name: ${COMPOSE_PROJECT_NAME}_edge_sim
    internal: true
    ipam: { config: [{ subnet: 10.231.30.0/24 }] }

  # Agent notebooks: the hardened JupyterHub servers agw-* (started by the agent gateway) live here
  # and nowhere else. The network is internal, so a notebook has no route to the internet and no
  # route into the platform network; it reaches the hub and its own proxy because the hub is
  # attached to this network too. 10.231.23.0/24 keeps it outside Docker's default 172.x range,
  # which once covered the address of the platform API inside the VM.
  agent_notebooks:
    name: ${COMPOSE_PROJECT_NAME}_agent_notebooks
    internal: true
    ipam: { config: [{ subnet: 10.231.23.0/24 }] }

services:
  reverse_proxy:
    image: traefik:v2.11
    restart: unless-stopped
    networks:
      default:
        aliases:
          # app. as well: the agent gateway's experiment runner reaches its own API through Traefik (#208)
          - app.${PROJECT_BASE_URL}
          - traefik.${PROJECT_BASE_URL}
          - keycloak.${PROJECT_BASE_URL}
          - registry.${PROJECT_BASE_URL}
          - api.${PROJECT_BASE_URL}
          - cvat.${PROJECT_BASE_URL}
          - jupyterhub.${PROJECT_BASE_URL}
      # Only what the simulated edge device needs: it resolves Portainer, the edge tunnel and the
      # registry to Traefik. Traefik itself keeps serving its routers over the default network.
      # The address is fixed: the device's daemon cannot use Docker's DNS (see edge_sim_docker
      # below), so it reaches Traefik through an /etc/hosts entry that has to name an address.
      edge_sim:
        aliases:
          - portainer.${PROJECT_BASE_URL}
          - edge.${PROJECT_BASE_URL}
          - registry.${PROJECT_BASE_URL}
        ipv4_address: 10.231.30.2
    # Enables the web UI and tells Traefik to listen to docker
    ports:
      # The React Frontend
      - "80:80"
      - "443:443"
      - "8000:8000"
      # The Traefik Web UI (enabled by --api.insecure=true)
      - "11000:8080"
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock
      - ./services/traefik/dynamic.yaml:/etc/traefik/dynamic.yaml
    labels:
      - traefik.enable=true

      # Dashboard
      - traefik.http.routers.traefik.rule=Host(`traefik.${PROJECT_BASE_URL}`)
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.entrypoints=https
      - traefik.http.routers.traefik.tls=true
      - traefik.http.routers.traefik.tls.options=default
      - traefik.http.routers.traefik.middlewares=security-headers

      # New middleware to disable external access to /metrics paths
      # - traefik.http.middlewares.block-metrics.replacepathregex.regex=^/metrics
      # - traefik.http.middlewares.block-metrics.replacepathregex.replacement=/

      # Wildcard TLS
      # - traefik.http.routers.traefik.tls.domains[0].main=${PROJECT_BASE_URL}
      # - traefik.http.routers.traefik.tls.domains[0].sans=*.${PROJECT_BASE_URL}

      # Security headers middleware
      - traefik.http.middlewares.security-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.security-headers.headers.stsPreload=true
      - traefik.http.middlewares.security-headers.headers.forceSTSHeader=true
      - traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true

    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik
      - --providers.file.watch=true
      - --entrypoints.http.address=:80
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      - --entrypoints.https.address=:443
      - --entryPoints.https.transport.respondingTimeouts.readTimeout=0
      - --entrypoints.edge.address=:8000
      - --entryPoints.edge.transport.respondingTimeouts.readTimeout=0

  # The Backend-Webserver by FastAPI
  backend:
    build:
      context: services/backend
      args:
        - DOCKER_VERSION=${DOCKER_VERSION}
        - NUCLIO_VERSION=${NUCLIO_VERSION}
        - NVIDIA_NGC_API_KEY=${NVIDIA_NGC_API_KEY}
        - KEYCLOAK_REALM_NAME=${KEYCLOAK_REALM_NAME}
    restart: unless-stopped
    expose:
      - "8000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`api.${PROJECT_BASE_URL}`)
      - traefik.http.routers.backend.tls=true
      - traefik.http.routers.backend.tls.options=default
      - traefik.http.routers.backend.middlewares=security-headers
      #- traefik.http.routers.backend.middlewares=security-headers,block-metrics
      - traefik.http.routers.backend.entrypoints=https
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
      - ./:/platform:ro
      - build-container-certs:/certs/docker-build
      - model-training:/code/model-training
      - model-inference:/code/model-inference
    depends_on:
      keycloak:
        condition: service_healthy
      postgres_backend:
        condition: service_started
      build_container:
        condition: service_started
      registry:
        condition: service_started
      fuseki:
        condition: service_healthy
    environment:
      PROJECT_BASE_URL: ${PROJECT_BASE_URL}
      PROJECT_NAME: ${COMPOSE_PROJECT_NAME}

      BACKEND_OPENID_CLIENT_ID: ${BACKEND_OPENID_CLIENT_ID}
      BACKEND_OPENID_CLIENT_SECRET: ${BACKEND_OPENID_CLIENT_SECRET}

      BACKEND_VERIFY_SSL: ${BACKEND_VERIFY_SSL}

      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KEYCLOAK_REALM_NAME: ${KEYCLOAK_REALM_NAME}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}

      REALM_SERVICE_ACCOUNT_USERNAME: ${REALM_SERVICE_ACCOUNT_USERNAME}
      REALM_SERVICE_ACCOUNT_PASSWORD: ${REALM_SERVICE_ACCOUNT_PASSWORD}

      REGISTRY_URL: registry.${PROJECT_BASE_URL}
      REGISTRY_TOKEN: ${BACKEND_REGISTRY_TOKEN}

      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: "minio:9000"

      FUSEKI_ENDPOINT: "http://fuseki:3030/"
      FUSEKI_ADMIN_USER: ${FUSEKI_ADMIN_USER}
      FUSEKI_ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD}

      CONNECTOR_PASSWORD: ${CONNECTOR_PASSWORD}

      PROVIDER_DATA_ENDPOINT: "http://edc:8182"

      POSTGRES_DB: ${BACKEND_POSTGRES_DB}
      POSTGRES_USER: ${BACKEND_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BACKEND_POSTGRES_PASSWORD}

      POSTGIS_DB: ${BACKEND_POSTGIS_DB}
      POSTGIS_USER: ${BACKEND_POSTGIS_USER}
      POSTGIS_PASSWORD: ${BACKEND_POSTGIS_PASSWORD}

      CVAT_SUPERUSER: ${CVAT_SUPERUSER}
      CVAT_SUPERUSER_PASSWORD: ${CVAT_SUPERUSER_PASSWORD}
      NUCLIO_CVAT_PROJECT_NAME: ${NUCLIO_CVAT_PROJECT_NAME}

      PORTAINER_VERSION: ${PORTAINER_VERSION}
      PORTAINER_OPENID_CLIENT_ID: ${PORTAINER_OPENID_CLIENT_ID}
      PORTAINER_OPENID_CLIENT_SECRET: ${PORTAINER_OPENID_CLIENT_SECRET}
      PORTAINER_ADMIN_USERNAME: admin
      PORTAINER_ADMIN_PASSWORD: ${PORTAINER_ADMIN_PASSWORD}
      PORTAINER_EDGE_PORT: ${PORTAINER_EDGE_PORT}

      GPUS: ${GPUS}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/metrics"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 5s

  # The Frontend-Webserver with React
  frontend:
    build:
      context: services/frontend
      args:
        - PROJECT_BASE_URL=${PROJECT_BASE_URL}
        - KEYCLOAK_REALM_NAME=${KEYCLOAK_REALM_NAME}
        - VITE_PORTAINER_VERSION=${PORTAINER_VERSION}
        - VITE_AGENT_ENABLED=${AGENT_ENABLED:-false}
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`app.${PROJECT_BASE_URL}`)
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.options=default
      - traefik.http.routers.frontend.middlewares=security-headers
      - traefik.http.routers.frontend.entrypoints=https
    depends_on:
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_healthy
      cvat_server:
        condition: service_started

  # Portainer
  portainer:
    build:
      context: services/portainer
      args:
        - PORTAINER_EDITION=${PORTAINER_EDITION}
        - PORTAINER_VERSION=${PORTAINER_VERSION}
        - ADMIN_PASSWORD=${PORTAINER_ADMIN_PASSWORD}
    restart: unless-stopped
    labels:
      - traefik.enable=true

      # Frontend
      - traefik.http.routers.portainer.service=portainer
      - traefik.http.routers.portainer.rule=Host(`portainer.${PROJECT_BASE_URL}`)
      - traefik.http.services.portainer.loadbalancer.server.port=9000
      - traefik.http.routers.portainer.tls=true
      - traefik.http.routers.portainer.tls.options=default
      - traefik.http.routers.portainer.middlewares=security-headers
      - traefik.http.routers.portainer.entrypoints=https

      # Edge
      - traefik.http.routers.edge.service=edge
      - traefik.http.routers.edge.rule=Host(`edge.${PROJECT_BASE_URL}`)
      - traefik.http.services.edge.loadbalancer.server.port=8000
      - traefik.http.routers.edge.tls=false
      - traefik.http.routers.edge.entrypoints=edge
      # Edge
      #- traefik.http.routers.edge.service=edge
      #- traefik.http.routers.edge.rule=Host(`edge.${PROJECT_BASE_URL}`)
      #- traefik.http.services.edge.loadbalancer.server.port=8000
      #- traefik.http.routers.edge.tls=true
      #- traefik.http.routers.edge.entrypoints=https

    volumes:
      - portainer-data:/data
    depends_on:
      - keycloak
    profiles: ["edge"]

  ### Simulated edge device (profile "edge-sim") ###
  # A simulated edge device for exercising the deployment path without endangering the host. It is
  # two containers: a Docker daemon of its own and the Portainer edge agent 2.19.5, which matches the
  # Portainer version of this stack. The daemon is rootless (docker:dind-rootless): a deployment on
  # the device therefore never becomes a sibling container of the host, and whoever controls the edge
  # agent is not root on the host. Both containers live only in the internal network edge_sim and
  # publish no ports, so a deployment opens its ports inside the device, not on the host. The agent
  # reads its registration secret (EDGE_ID, EDGE_KEY) from secrets/edge-sim.env, which a script
  # outside this repository writes on the host; the fork only carries edge-sim.env.example.

  # The Docker daemon of the device. The agent talks to it over the shared Unix socket in
  # /run/user/1000 (edge-sim-run); no TCP port is opened.
  edge_sim_docker:
    image: docker:27.5.1-dind-rootless
    restart: unless-stopped
    # Rootless Docker-in-Docker still needs the outer container privileged (the daemon inside runs
    # unprivileged, in a user namespace of its own).
    privileged: true
    hostname: sim-edge-01
    cpus: 2
    mem_limit: 6g
    pids_limit: 2048
    environment:
      DOCKER_TLS_CERTDIR: ""
    # The daemon inside the device pulls the inference image from the registry and asks Keycloak for
    # the token of that pull. Docker's DNS is out of reach in the device (rootlesskit's vpnkit
    # resolves through a stub that does not answer here: "lookup …: i/o timeout" for every name,
    # even registry-1.docker.io), so both names are pinned to the reverse proxy on the device's own
    # network, where they reach the same routers as through the public name. Measured on the instance
    # on 16.10.2026 during the D-E2 live test.
    extra_hosts:
      - "registry.${PROJECT_BASE_URL}:10.231.30.2"
      - "keycloak.${PROJECT_BASE_URL}:10.231.30.2"
    volumes:
      - edge-sim-docker:/home/rootless/.local/share/docker
      - edge-sim-run:/run/user/1000
    networks:
      - edge_sim
    labels:
      - agri-gaia.simulated=true
    profiles: ["edge-sim"]

  # The Portainer edge agent. EDGE=1 enables edge mode, EDGE_INSECURE_POLL=0 keeps certificate
  # verification on (Portainer sits behind Traefik with a valid certificate). The agent has full
  # control of the daemon of the device, as on a real device - but that daemon is not the host's.
  edge_sim_agent:
    image: portainer/agent:2.19.5
    restart: unless-stopped
    env_file:
      - path: secrets/edge-sim.env
        required: true
    environment:
      EDGE: "1"
      EDGE_INSECURE_POLL: "0"
      EDGE_INACTIVITY_TIMEOUT: 30m
      DOCKER_HOST: unix:///run/user/1000/docker.sock
    volumes:
      # The agent reaches the daemon of the device in two ways and both are needed: its own Docker
      # client follows DOCKER_HOST (/run/user/1000/docker.sock), while the Docker API proxy it
      # publishes through the edge tunnel dials the hard-coded path /var/run/docker.sock (agent
      # 2.19.5, http/proxy/local_socket.go). Without the second mount every request the platform
      # sends through the tunnel fails with "dial unix /var/run/docker.sock: no such file or
      # directory", so the device never registers and no container can be deployed to it.
      - edge-sim-run:/run/user/1000
      - edge-sim-run:/var/run
    networks:
      - edge_sim
    labels:
      - agri-gaia.simulated=true
    depends_on:
      - edge_sim_docker
    profiles: ["edge-sim"]

  # The Jena Fuseki Triple Store
  fuseki:
    restart: unless-stopped
    expose:
      - "3030"
    build:
      context: services/fuseki
      args:
        - JENA_VERSION=4.6.1
        - JVM_ARGS=-Xmx5G
        - FUSEKI_ADMIN_USER=${FUSEKI_ADMIN_USER}
        - FUSEKI_ADMIN_PASSWORD=${FUSEKI_ADMIN_PASSWORD}
    volumes:
      - fuseki-data:/fuseki/databases/DB2
      - ./config/fuseki/:/fuseki/run/configuration/imports/
    labels:
      - traefik.enable=true
      - traefik.http.routers.fuseki.rule=Host(`fuseki.${PROJECT_BASE_URL}`)
      - traefik.http.routers.fuseki.tls=true
      - traefik.http.routers.fuseki.tls.options=default
      - traefik.http.routers.fuseki.middlewares=security-headers
      - traefik.http.routers.fuseki.entrypoints=https
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q 'http://localhost:3030/$$/ping' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 30s
    profiles: ["semantics"]

  # The WebVOWL ontology visualizer
  webvowl:
    restart: unless-stopped
    expose:
      - "8080"
    build:
      context: ./
      dockerfile: services/webvowl/Dockerfile
      args:
        - WEBVOWL_VERSION=1.1.7
        - OWL2VOWL_VERSION=0.3.7
        - DEFAULT_ONTOLOGY_NAME=agri-gaia-onto
    labels:
      - traefik.enable=true
      - traefik.http.routers.webvowl.rule=Host(`webvowl.${PROJECT_BASE_URL}`)
      - traefik.http.routers.webvowl.tls=true
      - traefik.http.routers.webvowl.tls.options=default
      - traefik.http.routers.webvowl.middlewares=security-headers
      - traefik.http.routers.webvowl.entrypoints=https
    profiles: ["semantics"]

  # The MinIO S3 Storage
  minio:
    build:
      context: services/minio
      args:
        - MINIO_IMAGE_TAG=${MINIO_IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: https://minio-console.${PROJECT_BASE_URL}
      MINIO_IDENTITY_OPENID_CONFIG_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM_NAME}/.well-known/openid-configuration
      MINIO_IDENTITY_OPENID_CLIENT_ID: minio
      MINIO_IDENTITY_OPENID_CLAIM_NAME: minio_policy
      MINIO_IDENTITY_OPENID_SCOPES: openid
    labels:
      - traefik.enable=true

      - traefik.http.routers.minio.service=minio
      - traefik.http.routers.minio.tls=true
      - traefik.http.routers.minio.tls.options=default
      - traefik.http.routers.minio.middlewares=security-headers
      - traefik.http.routers.minio.entrypoints=https
      - traefik.http.routers.minio.rule=Host(`minio.${PROJECT_BASE_URL}`)
      - traefik.http.services.minio.loadbalancer.server.port=9000

      - traefik.http.routers.minio-console.service=minio-console
      - traefik.http.routers.minio-console.tls=true
      - traefik.http.routers.minio-console.tls.options=default
      - traefik.http.routers.minio-console.middlewares=security-headers
      - traefik.http.routers.minio-console.entrypoints=https
      - traefik.http.routers.minio-console.rule=Host(`minio-console.${PROJECT_BASE_URL}`)
      - traefik.http.services.minio-console.loadbalancer.server.port=9001
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://minio:9000/minio/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 5s
    depends_on:
      keycloak:
        condition: service_healthy

  # The DB for storing geographical data
  postgis_backend:
    image: postgis/postgis:14-3.3
    # unofficial image build that supports arm64
    # image: ghcr.io/baosystems/postgis:14-3.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BACKEND_POSTGIS_DB}
      POSTGRES_USER: ${BACKEND_POSTGIS_USER}
      POSTGRES_PASSWORD: ${BACKEND_POSTGIS_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./data/geo:/tmp/data

  # The main DB used by the Backend
  postgres_backend:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BACKEND_POSTGRES_DB}
      POSTGRES_USER: ${BACKEND_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BACKEND_POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # The Database for keycloak
  postgres_keycloak:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data

  keycloak:
    build:
      context: services/keycloak
      args:
        - PROJECT_BASE_URL=${PROJECT_BASE_URL}
        - REALM_NAME=${KEYCLOAK_REALM_NAME}
        - BACKEND_OPENID_CLIENT_SECRET=${BACKEND_OPENID_CLIENT_SECRET}
        - PORTAINER_OPENID_CLIENT_SECRET=${PORTAINER_OPENID_CLIENT_SECRET}
        - JUPYTERHUB_OPENID_CLIENT_SECRET=${JUPYTERHUB_OPENID_CLIENT_SECRET}
        - KC_HEALTH_ENABLED=true
        - KC_METRICS_ENABLED=true
    restart: unless-stopped
    expose:
      - 8080
    environment:
      REALM_SERVICE_ACCOUNT_USERNAME: ${REALM_SERVICE_ACCOUNT_USERNAME}
      REALM_SERVICE_ACCOUNT_PASSWORD: ${REALM_SERVICE_ACCOUNT_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_FRONTEND_URL: ${KEYCLOAK_FRONTEND_URL}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      KC_DB_VENDOR: postgres
      KC_DB_URL_HOST: postgres_keycloak
      KC_DB_DATABASE: keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://keycloak.${PROJECT_BASE_URL}
      KC_HOSTNAME_STRICT: "false"
      # load exported config on startup
      REGISTRATION_EVENT_WEBHOOKURL: http://backend:8000/service/user-registration
      DEREGISTRATION_EVENT_WEBHOOKURL: http://backend:8000/service/user-deregistration
      WEBHOOK_RECEIVER_CLIENT_ID: ${BACKEND_OPENID_CLIENT_ID}
      REALM_NAME: ${KEYCLOAK_REALM_NAME}
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.service=keycloak
      - traefik.http.routers.keycloak.rule=Host(`keycloak.${PROJECT_BASE_URL}`)
      - traefik.http.routers.keycloak.tls=true
      - traefik.http.routers.keycloak.tls.options=default
      - traefik.http.routers.keycloak.middlewares=security-headers
      - traefik.http.routers.keycloak.entrypoints=https
      #- traefik.http.routers.keycloak.middlewares=block-metrics
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
    depends_on:
      - postgres_keycloak
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/realms/${KEYCLOAK_REALM_NAME}/.well-known/openid-configuration"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  registry:
    build:
      context: services/docker-registry
      args:
        - KEYCLOAK_REALM_NAME=${KEYCLOAK_REALM_NAME}
    restart: unless-stopped
    volumes:
      - registry-data:/data
      #- ./services/docker-registry/config.yml:/etc/docker/registry/config.yml
    expose:
      - 5000
    environment:
      CERT_ENDPOINT: http://keycloak:8080/realms/${KEYCLOAK_REALM_NAME}/protocol/openid-connect/certs

      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /data
      REGISTRY_STORAGE_DELETE_ENABLED: "true"

      REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /opt/certs/registry_trust_chain.pem
      REGISTRY_AUTH_TOKEN_REALM: https://keycloak.${PROJECT_BASE_URL}/realms/${KEYCLOAK_REALM_NAME}/protocol/docker-v2/auth
      REGISTRY_AUTH_TOKEN_SERVICE: docker-registry
      REGISTRY_AUTH_TOKEN_ISSUER: https://keycloak.${PROJECT_BASE_URL}/realms/${KEYCLOAK_REALM_NAME}

      LOG_LEVEL: debug

      REGISTRY_NOTIFICATIONS_ENDPOINTS: "- name: pushlistener

        \  url: http://backend:8000/service/registry-event

        \  headers:

        \    Authorization: [Bearer ${BACKEND_REGISTRY_TOKEN}]

        \  timeout: 10s

        \  threshold: 5

        \  backoff: 2s"
    labels:
      - traefik.enable=true
      - traefik.http.routers.registry.service=registry
      - traefik.http.routers.registry.rule=Host(`registry.${PROJECT_BASE_URL}`)
      - traefik.http.routers.registry.tls=true
      - traefik.http.routers.registry.tls.options=default
      - traefik.http.routers.registry.middlewares=security-headers
      - traefik.http.routers.registry.entrypoints=https
      - traefik.http.services.registry.loadbalancer.server.port=5000
    depends_on:
      keycloak:
        condition: service_healthy

  build_container:
    build:
      context: services/build-container
      args:
        - NVIDIA_NGC_API_KEY=${NVIDIA_NGC_API_KEY}
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_SAN: "DNS:build-container"
      DOCKER_TLS_CERTDIR: "/certs"
    networks:
      default:
        aliases:
          - build-container
    volumes:
      - build-container-certs:/certs

  ### Jupyter Hub ###
  jupyterhub:
    build:
      context: services/jupyterhub
      args:
        - JUPYTERHUB_VERSION=${JUPYTERHUB_VERSION}
    hostname: jupyterhub
    restart: unless-stopped
    # Service token for the agent gateway (AGW_JUPYTERHUB_TOKEN); without the file the hub starts
    # unchanged. In production the file lives in /opt/agri-gaia/secrets/ and is copied here by the
    # deployment.
    env_file:
      - path: secrets/jupyterhub-agent.env
        required: false
    volumes:
      # The JupyterHub configuration file
      - ./services/jupyterhub/config:/srv/jupyterhub/config:ro"
      # Bind Docker socket on the host so we can connect to the daemon from
      # within the container
      - "/var/run/docker.sock:/var/run/docker.sock:rw"
      # Bind Docker volume on host for JupyterHub database and cookie secrets
      - "jupyterhub-data:/data"
    environment:
      ROOT_URL: ${PROJECT_BASE_URL}

      OAUTH_URL: ${KEYCLOAK_FRONTEND_URL}
      OAUTH_REALM: ${KEYCLOAK_REALM_NAME}
      OAUTH_CLIENT_ID: ${JUPYTERHUB_OPENID_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${JUPYTERHUB_OPENID_CLIENT_SECRET}

      PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      DOCKER_NETWORK_NAME: ${COMPOSE_PROJECT_NAME}_network
      # Network and limits of the hardened agw-* servers (see platform_spawner.py). The limits are
      # pass-throughs with the spawner's own defaults, so they can be raised from the platform
      # .env when a notebook needs more than 2 CPUs or 8 GB.
      AGW_NOTEBOOK_NETWORK: ${COMPOSE_PROJECT_NAME}_agent_notebooks
      AGW_NOTEBOOK_CPUS: ${AGW_NOTEBOOK_CPUS:-2}
      AGW_NOTEBOOK_MEM: ${AGW_NOTEBOOK_MEM:-8G}

      NGC_IMAGE_TAG: ${JUPYTERHUB_NGC_IMAGE_TAG}
      JUPYTERHUB_VERSION: ${JUPYTERHUB_VERSION}
      JUPYTERHUB_CRYPT_KEY: ${JUPYTERHUB_CRYPT_KEY}
      GPUS: ${GPUS}
      # GPU of the agw-* servers, follows GPUS; "none" switches it off for agent servers only
      AGW_NOTEBOOK_GPUS: ${AGW_NOTEBOOK_GPUS:-${GPUS}}

    labels:
      - traefik.enable=true
      # The hub is attached to two networks since the agent notebooks exist; Traefik has to use the
      # platform network, the internal notebook network is not reachable for it.
      - traefik.docker.network=${COMPOSE_PROJECT_NAME}_network
      - traefik.http.routers.jupyterhub.service=jupyterhub
      - traefik.http.routers.jupyterhub.rule=Host(`jupyterhub.${PROJECT_BASE_URL}`)
      - traefik.http.routers.jupyterhub.tls=true
      - traefik.http.routers.jupyterhub.tls.options=default
      - traefik.http.routers.jupyterhub.middlewares=security-headers
      - traefik.http.routers.jupyterhub.entrypoints=https
      #- traefik.http.routers.jupyterhub.middlewares=block-metrics
      - traefik.http.services.jupyterhub.loadbalancer.server.port=8000
    # The hub also sits in the internal notebook network, because it is the only way out for an
    # agw-* notebook (hub API and its own proxy path).
    networks:
      default: {}
      agent_notebooks: {}

  ##### CVAT #####

  # CVAT Server
  cvat_server:
    build:
      context: services/cvat
      args:
        - S3FS_VERSION=${S3FS_VERSION}
        - NUCLIO_VERSION=${NUCLIO_VERSION}
        - PROJECT_BASE_URL=${PROJECT_BASE_URL}
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - "/dev/fuse:/dev/fuse"
    restart: unless-stopped
    depends_on:
      - cvat_redis
      - cvat_db
      - cvat_opa
      - nuclio
    environment:
      DJANGO_MODWSGI_EXTRA_ARGS: ""
      ALLOWED_HOSTS: "*"
      CVAT_SERVERLESS: 1
      CVAT_REDIS_HOST: "cvat_redis"
      CVAT_REDIS_PASSWORD: ""
      CVAT_POSTGRES_HOST: "cvat_db"
      CVAT_POSTGRES_PORT: 5432
      ADAPTIVE_AUTO_ANNOTATION: "false"
      IAM_OPA_BUNDLE: "1"
      no_proxy: nuclio,opa,${no_proxy:-}
      NUMPROCS: 1
      CVAT_ANALYTICS: 0
      CVAT_BASE_URL: "https://cvat.${PROJECT_BASE_URL}"

      CVAT_SUPERUSER: ${CVAT_SUPERUSER}
      CVAT_SUPERUSER_PASSWORD: ${CVAT_SUPERUSER_PASSWORD}
      CVAT_SUPERUSER_EMAIL: ${CVAT_SUPERUSER_EMAIL}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    labels:
      - traefik.enable=true
      - traefik.http.routers.cvat.service=cvat
      - traefik.http.routers.cvat.tls=true
      - traefik.http.routers.cvat.tls.options=default
      - traefik.http.routers.cvat.middlewares=security-headers
      - traefik.http.routers.cvat.entrypoints=https
      - traefik.http.routers.cvat.rule=Host(`cvat.${PROJECT_BASE_URL}`) && PathPrefix(`/api/`, `/git/`, `/opencv/`, `/static/`, `/admin`, `/documentation/`, `/django-rq`)
      - traefik.http.services.cvat.loadbalancer.server.port=8080
    volumes:
      - cvat-data:/home/django/data
      - cvat-keys:/home/django/keys
      - cvat-logs:/home/django/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - cvat-server
    command: -c supervisord.conf
    profiles: ["annotation"]

  # CVAT UI (Client)
  cvat_ui:
    image: cvat/ui:v2.4.2
    restart: unless-stopped
    depends_on:
      - cvat_server
    expose:
      - "7000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.cvat_ui.tls=true
      - traefik.http.routers.cvat_ui.tls.options=default
      - traefik.http.routers.cvat_ui.middlewares=security-headers
      - traefik.http.routers.cvat_ui.entrypoints=https
      - traefik.http.routers.cvat_ui.rule=Host(`cvat.${PROJECT_BASE_URL}`)
    profiles: ["annotation"]

  # CVAT Postgres database
  cvat_db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_DB: cvat
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - cvat-db:/var/lib/postgresql/data
    profiles: ["annotation"]

  # CVAT Redis database
  cvat_redis:
    image: redis:4.0-alpine
    restart: unless-stopped
    profiles: ["annotation"]

  # CVAT Open policy agent
  cvat_opa:
    image: openpolicyagent/opa:0.45.0-rootless
    restart: unless-stopped
    networks:
      default:
        aliases:
          - opa
    command:
      - run
      - --server
      - --log-level=error
      - --set=services.cvat.url=http://cvat-server:8080
      - --set=bundles.cvat.service=cvat
      - --set=bundles.cvat.resource=/api/auth/rules
      - --set=bundles.cvat.polling.min_delay_seconds=5
      - --set=bundles.cvat.polling.max_delay_seconds=15
    profiles: ["annotation"]

  nuclio-templates-init:
    image: busybox:1.36
    volumes:
      - /tmp:/tmp
    command:
      - sh
      - -c
      - |
        if [ ! -s /tmp/templates.zip ]; then
          echo 'UEsFBgAAAAAAAAAAAAAAAAAAAAAAAA==' | base64 -d > /tmp/templates.zip
          echo "Created empty /tmp/templates.zip stub for Nuclio dashboard."
        else
          echo "/tmp/templates.zip already present; leaving it alone."
        fi
    restart: "no"
    profiles: ["annotation"]

  # CVAT Nuclio (Auto Annotation)
  nuclio:
    image: "quay.io/nuclio/dashboard:${NUCLIO_VERSION}-amd64"
    restart: unless-stopped
    depends_on:
      nuclio-templates-init:
        condition: service_completed_successfully
    volumes:
      - /tmp:/tmp
      - /var/run/docker.sock:/var/run/docker.sock
      - ./services/nuclio/platform.yaml:/etc/nuclio/config/platform/platform.yaml:ro
    environment:
      http_proxy:
      https_proxy:
      no_proxy: 172.28.0.1
      NUCLIO_CHECK_FUNCTION_CONTAINERS_HEALTHINESS: "true"
      NUCLIO_DASHBOARD_DEFAULT_FUNCTION_MOUNT_MODE: "volume"
    expose:
      - "8070"
    logging:
      driver: "json-file"
      options:
        max-size: 100m
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.http.routers.nuclio.service=nuclio
      - traefik.http.routers.nuclio.rule=Host(`nuclio.${PROJECT_BASE_URL}`)
      - traefik.http.routers.nuclio.tls=true
      - traefik.http.routers.nuclio.tls.options=default
      - traefik.http.routers.nuclio.middlewares=security-headers,nuclio-auth
      - traefik.http.routers.nuclio.entrypoints=https
      - traefik.http.middlewares.nuclio-auth.basicauth.removeHeader=true
      - traefik.http.middlewares.nuclio-auth.basicauth.users=${REALM_SERVICE_ACCOUNT_USERNAME}:${REALM_SERVICE_ACCOUNT_HTPASSWD}
      - traefik.http.services.nuclio.loadbalancer.server.port=8070
    profiles: ["annotation"]

  ##### MONITORING #####

  # Prometheus
  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    volumes:
      - prometheus-data:/prometheus
      - ./services/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    expose:
      - "9090"
    links:
      - cadvisor:cadvisor
    depends_on:
      - cadvisor
    labels:
      - traefik.enable=true # disabled in production, only enabled for development
      - traefik.http.routers.prometheus.rule=Host(`prometheus.${PROJECT_BASE_URL}`)
      - traefik.http.routers.prometheus.tls=true
      - traefik.http.routers.prometheus.tls.options=default
      - traefik.http.routers.prometheus.middlewares=security-headers
      - traefik.http.routers.prometheus.entrypoints=https
    profiles: ["monitoring"]

  # Host System Monitoring
  node-exporter:
    image: prom/node-exporter
    restart: unless-stopped
    volumes:
      - "/:/host:ro,rslave"
    command:
      - "--path.rootfs=/host"
      - --collector.filesystem.mount-points-exclude
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
    expose:
      - "9100"
    profiles: ["monitoring"]

  # Container Monitoring
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.45.0
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      # Normal Linux docker mount:
      - /var/lib/docker/:/var/lib/docker:ro
      # WSL2 docker mount workaround:
      #- /mnt/windows_docker/:/rootfs/var/lib/docker:ro
    expose:
      - "8080"
    profiles: ["monitoring"]

  # Grafana
  grafana:
    image: grafana/grafana-oss
    user: "472"
    depends_on:
      - prometheus
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
      - ./services/monitoring/grafana/provisioning/:/etc/grafana/provisioning/
    expose:
      - "3000"
    links:
      - prometheus:prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.tls=true
      - traefik.http.routers.grafana.tls.options=default
      - traefik.http.routers.grafana.middlewares=security-headers
      - traefik.http.routers.grafana.entrypoints=https
      - traefik.http.routers.grafana.rule=Host(`monitoring.${PROJECT_BASE_URL}`)
    profiles: ["monitoring"]

  ##EDC Provider
  edc:
    build:
      context: services/edc
      args:
        - PROJECT_BASE_URL=${PROJECT_BASE_URL}
        - MINIO_ROOT_USER=${MINIO_ROOT_USER}
        - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
        - CONNECTOR_PASSWORD=${CONNECTOR_PASSWORD}
        - KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
    restart: on-failure:3
    volumes:
      - ./secrets/edc:/home/secrets
    labels:
      - traefik.enable=true

      - traefik.http.routers.edc.service=edc
      - traefik.http.routers.edc.tls=true
      - traefik.http.routers.edc.tls.options=default
      - traefik.http.routers.edc.middlewares=security-headers
      - traefik.http.routers.edc.entrypoints=https
      - traefik.http.routers.edc.rule=Host(`edc.${PROJECT_BASE_URL}`)
      - traefik.http.services.edc.loadbalancer.server.port=8182

      - traefik.http.routers.edc-web.service=edc-web
      - traefik.http.routers.edc-web.tls=true
      - traefik.http.routers.edc-web.tls.options=default
      - traefik.http.routers.edc-web.middlewares=security-headers
      - traefik.http.routers.edc-web.entrypoints=https
      - traefik.http.routers.edc-web.rule=Host(`edc-web.${PROJECT_BASE_URL}`)
      - traefik.http.services.edc-web.loadbalancer.server.port=8181

      - traefik.http.routers.edc-ids.service=edc-ids
      - traefik.http.routers.edc-ids.tls=true
      - traefik.http.routers.edc-ids.tls.options=default
      - traefik.http.routers.edc-ids.middlewares=security-headers
      - traefik.http.routers.edc-ids.entrypoints=https
      - traefik.http.routers.edc-ids.rule=Host(`edc-ids.${PROJECT_BASE_URL}`)
      - traefik.http.services.edc-ids.loadbalancer.server.port=8282
    profiles: ["edc"]

  triton:
    image: nvcr.io/nvidia/tritonserver:24.09-py3
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_DEFAULT_REGION=us-east-1
    expose:
      - 8000
      - 8001
      - 8002
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    command: ["tritonserver", "--model-repository=s3://minio:9000/triton", "--model-control-mode=poll"]
    profiles: ["triton"]


  ### Agent gateway (profile "agents") ###
  # The agent gateway (services/agent-gateway) runs coding agents in sandboxes and authorizes every
  # platform call against the delegation of the chat. The sandboxes are started by the orchestrator
  # through the Docker API and are not part of this compose project. Secrets come from
  # secrets/agent-gateway.env (orchestrator) and secrets/agent-gateway-services.env (database,
  # object store, search); templates next to them as *.env.example.

  # Build-only services: images of the agent sandbox (pi) and the execution sandbox.
  agent_pi_image:
    build:
      context: services/agent-gateway
      dockerfile: images/agw-basis/Dockerfile
      target: pi
    image: agri_gaia-agent_pi
    entrypoint: ["true"]
    restart: "no"
    profiles: ["agents"]

  agent_exec_image:
    build:
      context: services/agent-gateway
      dockerfile: images/agw-basis/Dockerfile
      target: exec
    image: agri_gaia-agent_exec
    entrypoint: ["true"]
    restart: "no"
    profiles: ["agents"]

  agent_gateway:
    build:
      context: services/agent-gateway
      # X8: the gateway reports its own commit; the freeze step refuses a build without one.
      args:
        AGW_COMMIT: ${AGW_COMMIT:-dev}
        AGW_DESCRIBE: ${AGW_DESCRIBE:-dev}
    restart: unless-stopped
    env_file:
      - path: secrets/agent-gateway.env
        required: false
      # Same file as for the hub: AGW_JUPYTERHUB_TOKEN is the service token of the agent gateway.
      - path: secrets/jupyterhub-agent.env
        required: false
      # Experiment run account (X1): AGW_EXP_USER, AGW_EXP_PASSWORD, AGW_EXP_API_TOKEN.
      - path: secrets/agent-experiments.env
        required: false
    environment:
      AGW_AUTH_MODE: oidc
      AGW_PUBLIC_URL: https://app.${PROJECT_BASE_URL}/agent
      AGW_ALLOWED_HOSTS: app.${PROJECT_BASE_URL}
      AGW_FRAME_ANCESTORS: "'self'"
      AGW_OIDC_ISSUER: https://keycloak.${PROJECT_BASE_URL}/realms/${KEYCLOAK_REALM_NAME}
      AGW_OIDC_CLIENT_ID: agw-agent
      AGW_PLATFORM_API_URL: https://api.${PROJECT_BASE_URL}
      AGW_PLATFORM_TOKEN_URL: https://keycloak.${PROJECT_BASE_URL}/realms/${KEYCLOAK_REALM_NAME}/protocol/openid-connect/token
      AGW_PLATFORM_CLIENT_ID: agw-agent
      AGW_PLATFORM_TOKEN_EXCHANGE: "true"
      # Pre-annotation through CVAT: the gateway logs the chat's user into CVAT through the platform
      # (with that user's own session, kept in memory, never the superuser's) and runs the operator's
      # Nuclio functions over a dataset. Off without AGW_CVAT_API_URL; then the path /_agw/annotation
      # answers "unavailable". AGW_ANNOTATION_FUNCTIONS is the operator's comma-separated list of
      # installed function ids (empty: the operator installed none, so only the user's own count).
      AGW_CVAT_API_URL: https://cvat.${PROJECT_BASE_URL}
      AGW_CVAT_PUBLIC_URL: https://cvat.${PROJECT_BASE_URL}
      AGW_ANNOTATION_FUNCTIONS: ${AGW_ANNOTATION_FUNCTIONS:-}
      # JupyterHub: the gateway starts the hardened notebook servers agw-* of a chat over the hub
      # API (service name and API URL in the platform network) and opens them through the hub's
      # public address. AGW_NOTEBOOK_PREFIX is the SERVER name prefix ("agw", the gateway builds
      # "agw-<chat>"); the spawner hardens only servers whose name starts with "agw-" (AGENT_PREFIX
      # in platform_spawner.py), so this must stay "agw" (or a prefix hardened there too).
      AGW_JUPYTERHUB_API_URL: http://jupyterhub:8081/hub/api
      AGW_JUPYTERHUB_PUBLIC_URL: https://jupyterhub.${PROJECT_BASE_URL}
      AGW_NOTEBOOK_PREFIX: agw
      # GPU of the agw-* servers, follows GPUS; none switches it off (shown in the approval card)
      AGW_NOTEBOOK_GPUS: ${AGW_NOTEBOOK_GPUS:-${GPUS}}
      AGW_S3_ENDPOINT: agent_s3:9000
      AGW_CATALOG: /etc/agw/models.json
      AGW_IMAGE: agri_gaia-agent_exec
      AGW_PI_IMAGE: agri_gaia-agent_pi
      AGW_EGRESS_NETWORK: ${COMPOSE_PROJECT_NAME}_agent_egress
      AGW_EGRESS_SUBNET: 10.231.20.0/24
      AGW_SOCKET_VOLUME: ${COMPOSE_PROJECT_NAME}_agent_sockets
      AGW_SOCKET_ROOT: /run/agw
      AGW_PROXY_BASE_URL: http://orchestrator:18481
      # The agent notebooks and the simulated edge device sit in their own subnets as well: they are
      # targets of the agent, not a source of platform calls. AGW_BLOCKED_SUBNETS is a second line;
      # the isolation itself comes from the internal networks.
      AGW_BLOCKED_SUBNETS: 10.231.20.0/24,10.231.21.0/24,10.231.22.0/24,10.231.23.0/24,10.231.128.0/17,10.231.30.0/24
      AGW_SEARXNG_URL: http://agent_searxng:8080
      # The package gate in the gateway speaks to the caches over the network agent_pkg (issue #175).
      AGW_NPM_CACHE_URL: http://agent_npm_cache:4873
      AGW_PIP_CACHE_URL: http://agent_pip_cache:5000
      # Bindings of every new chat: cli, mcp, api or a combination such as cli,api (gateway issue #29).
      AGW_TOOLSETS: ${AGW_TOOLSETS:-cli}
      # Warm slots for that combination; an idle slot needs about 100-210 MB (pi) plus about 3 MB (sandbox).
      AGW_POOL_SIZE: ${AGW_POOL_SIZE:-4}
      # The simulated edge device the agent gateway may send test requests to after a deployment
      # (gateway R3, issue #116): name=container, and only this one. A real device is never reached.
      AGW_EDGE_SIM_DEVICES: sim-edge-01=${COMPOSE_PROJECT_NAME}-edge_sim_docker-1
      # Compute calls a chat may accept before the gateway refuses further ones (default in the code:
      # 3). The deployment raises it to 6 so a test chat can build a triton inference container.
      AGW_COMPUTE_MAX_PER_CHAT: ${AGW_COMPUTE_MAX_PER_CHAT:-12}
      # Hard limit on failed tool calls in a row per chat (gateway #217): all calls, and calls of one tool; 0 = off.
      AGW_MAX_FAILED_TOOL_CALLS: ${AGW_MAX_FAILED_TOOL_CALLS:-20}
      AGW_MAX_FAILED_SAME_TOOL: ${AGW_MAX_FAILED_SAME_TOOL:-5}
      # Runtime of inference images the agent builds when the user names none: triton (default) or ovms (gateway #230).
      AGW_INFERENCE_RUNTIME: ${AGW_INFERENCE_RUNTIME:-triton}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-sockets:/run/agw
      - ./services/agent-gateway/models.json:/etc/agw/models.json:ro
    networks:
      default: {}
      agent_intern: {}
      agent_search: {}
      agent_pkg: {}
    expose:
      - "18480"
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COMPOSE_PROJECT_NAME}_network
      # Served under the platform's own host (https://app.<base>/agent/), so the existing certificate applies
      # and the panel shares its origin with the frontend. The prefix is stripped before the orchestrator.
      - traefik.http.routers.agent.rule=Host(`app.${PROJECT_BASE_URL}`) && PathPrefix(`/agent`)
      - traefik.http.routers.agent.tls=true
      - traefik.http.routers.agent.tls.options=default
      # Comma-separated list: Traefik 2 ignores indexed middleware labels (with [0], [1], …) on Docker routers.
      - traefik.http.routers.agent.middlewares=agent-trailing-slash,agent-strip-prefix,security-headers
      # /agent → /agent/: the web UI uses relative URLs, which resolve against / without the slash
      - traefik.http.middlewares.agent-trailing-slash.redirectregex.regex=^(https?://[^/]+/agent)$$
      - traefik.http.middlewares.agent-trailing-slash.redirectregex.replacement=$${1}/
      - traefik.http.middlewares.agent-trailing-slash.redirectregex.permanent=true
      - traefik.http.middlewares.agent-strip-prefix.stripprefix.prefixes=/agent
      - traefik.http.routers.agent.entrypoints=https
      - traefik.http.services.agent.loadbalancer.server.port=18480
    depends_on:
      agent_postgres:
        condition: service_healthy
      agent_s3:
        condition: service_healthy
      agent_npm_cache:
        condition: service_started
      agent_pip_cache:
        condition: service_started
      agent_searxng:
        condition: service_started
      agent_pi_image:
        condition: service_completed_successfully
      agent_exec_image:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    stop_grace_period: 30s
    profiles: ["agents"]

  agent_postgres:
    # PG 17.11, the image running since 2026-10; bump with check-artifacts.py --suggest-digests
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    env_file:
      - path: secrets/agent-gateway-services.env
        required: false
    environment:
      POSTGRES_USER: agwpoc
      POSTGRES_DB: agwpoc
    volumes:
      - agent-postgres-data:/var/lib/postgresql/data
    networks: [agent_intern]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agwpoc -d agwpoc"]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles: ["agents"]

  agent_s3:
    image: rustfs/rustfs@sha256:fa19210ac4697c79d7ccca1ec9b0eb91aebacc6691991ffb14014bb3c67e6cc3
    restart: unless-stopped
    env_file:
      - path: secrets/agent-gateway-services.env
        required: false
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    security_opt: ["no-new-privileges:true"]
    volumes:
      - agent-s3-data:/data
    networks: [agent_intern]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    profiles: ["agents"]

  # Package caches for npm and pip. A sandbox never reaches them: its pip and npm talk to the package gate in the
  # agent gateway, which checks the package names of the chat's grants first and then asks the cache.
  agent_npm_cache:
    image: verdaccio/verdaccio:6.10.4@sha256:43c4067288b050422265407ea2fe747e511fcd0c407a85ec90ab9a326d9400cd
    restart: unless-stopped
    volumes:
      - agent-npm-cache:/verdaccio/storage
      - ./services/agent-gateway/pkgcache/verdaccio.yaml:/verdaccio/conf/config.yaml:ro
    networks: [agent_pkg]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    profiles: ["agents"]

  agent_pip_cache:
    image: epicwink/proxpi:1.3.0@sha256:0748b92ddf75405d9d83fbd1705517f951e67e0540af86e0a9bf4de388ba86c0
    restart: unless-stopped
    environment:
      PROXPI_CACHE_DIR: /var/cache/proxpi
      PROXPI_CACHE_SIZE: "10000000000"
      PROXPI_DOWNLOAD_TIMEOUT: "120"
      PROXPI_CONNECT_TIMEOUT: "10"
      PROXPI_READ_TIMEOUT: "60"
    volumes:
      - agent-pip-cache:/var/cache/proxpi
    networks: [agent_pkg]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    profiles: ["agents"]

  # Own metasearch engine for the agent's web search; only the orchestrator reaches it.
  agent_searxng:
    image: searxng/searxng:2026.9.30-a9d990033@sha256:a07a5cd2da2c63d66e559f9e4d3a3db106cfc6c32fb0ac70abe91cc28bcd7350
    restart: unless-stopped
    user: "977:977"
    env_file:
      - path: secrets/agent-gateway-services.env
        required: false
    environment:
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./services/agent-gateway/searxng/settings.yml:/etc/searxng/settings.yml:ro
    tmpfs:
      - /var/cache/searxng:uid=977,gid=977
      - /tmp
    networks: [agent_search]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    profiles: ["agents"]

volumes:
  fuseki-data:
  minio-data:
  postgis-data:
  postgres-data:
  postgres-keycloak-data:
  registry-data:
  portainer-data:
  build-container-certs:
  model-training:
  model-inference:
  cvat-db:
  cvat-data:
  cvat-keys:
  cvat-logs:
  prometheus-data:
  grafana-data:
  jupyterhub-data:
  triton-data:
  agent-postgres-data:
  agent-s3-data:
  agent-npm-cache:
  agent-pip-cache:
  agent-sockets:
    name: ${COMPOSE_PROJECT_NAME}_agent_sockets
  # Simulated edge device: the data directory of its Docker daemon and the socket directory it shares
  # with the edge agent. Both survive a redeploy, so the device keeps its Portainer endpoint.
  edge-sim-docker:
  edge-sim-run:
